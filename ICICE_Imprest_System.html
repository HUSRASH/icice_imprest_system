FORMS.proc_form = async (fd, form) => {
  const title = fd.get('title').trim();
  if (!title || !fd.get('requesterName')) { toast('Please fill the title and requester.', 'error'); return; }
  const files = form.querySelector('#proc_files').files;
  const docs = await registerFiles(files, { module: 'Procurement', refCode: '', department: fd.get('department') });
  const wf = S.settings.workflow.procurement;
  const p = {
    id: uid(), code: nextProcCode(),
    title, description: (fd.get('description') || '').trim(),
    department: fd.get('department'), requesterName: fd.get('requesterName').trim(),
    sourceEmail: fd.get('sourceEmail') || procEmails().procurement, gsuiteRef: (fd.get('gsuiteRef') || '').trim(),
    amount: Number(fd.get('amount')) || 0, supplier: (fd.get('supplier') || '').trim(), priority: fd.get('priority') || 'Normal',
    dateReceived: fd.get('dateReceived'), documents: docs.map(d => d.id),
    goni: { decision: null }, jibo: { decision: null }, dg: { decision: null },
    stage: { poNumber: '', poAt: null, deliveredAt: null, completedAt: null },
    status: wf.requireGoni ? 'pending_goni' : (wf.requireJibo ? 'pending_jibo' : (wf.requireDG ? 'pending_dg' : 'approved')),
    timeline: [], createdAt: nowISO(), updatedAt: nowISO()
  };
  docs.forEach(d => { d.refCode = p.code; });
  S.procurements.unshift(p);
  addEvent(p, 'Request logged from procurement email' + (p.gsuiteRef ? ' (G-Suite ref ' + p.gsuiteRef + ')' : ''), p.department + ' · ' + p.requesterName, 'gold');
  save(); closeModal(); render();
  toast(p.code + ' logged — notifying Goni by email.');
  if (p.status === 'pending_goni') {
    notifyProcApprover('approve_goni', p);
    sendEmail('procurement_logged', procEmails().goni, 'Procurement ' + p.code + ' — your approval is required',
      `<p>A new procurement request has been logged from the procurement inbox${p.gsuiteRef ? ' (G-Suite ref <b>' + esc(p.gsuiteRef) + '</b>)' : ''}.</p>
       <p><b>Item:</b> ${esc(p.title)}<br><b>Department:</b> ${esc(p.department)} · <b>Requester:</b> ${esc(p.requesterName)}<br>
       <b>Estimated amount:</b> ${p.amount ? fmtMoney(p.amount) : '—'}${p.supplier ? '<br><b>Supplier:</b> ' + esc(p.supplier) : ''}</p>
       <p>Please log in to <b>approve or reject</b> this request.</p>`, p.code);
  } else if (p.status === 'pending_jibo') {
    notifyProcApprover('approve_finance', p);
  } else if (p.status === 'pending_dg') {
    notifyProcApprover('approve_dg', p);
  }
  save();
};
function notifyProcApprover(perm, p) {
  notify(usersWithPerm(perm).map(u => u.id), { title: p.code + ' awaiting your approval', body: p.title + ' — ' + p.department, link: 'approvals' });
}

/* ---------- Decisions ---------- */
function procDecisionModal(p, stage) {
  const meta = {
    goni: { title: 'Goni Approval — ' + p.code, who: 'Goni', evKey: 'procurement_goni', nextPerm: 'approve_finance', nextMail: 'jibo', nextLabel: 'Jibo (Finance Officer)' },
    jibo: { title: 'Jibo (Finance) Approval — ' + p.code, who: 'Jibo — Finance Officer', evKey: 'procurement_jibo', nextPerm: 'approve_dg', nextMail: 'dg', nextLabel: 'Director General' },
    dg: { title: 'DG Final Approval — ' + p.code, who: 'Director General', evKey: 'procurement_dg', nextPerm: '', nextMail: '', nextLabel: '' }
  }[stage];
  const wf = S.settings.workflow.procurement;
  decisionModal({
    title: meta.title, sub: p.title + ' · ' + p.department,
    body: `<div class="detail-grid mb14">
      <div class="dg-item"><div class="l">Estimated amount</div><div class="v big">${p.amount ? fmtMoney(p.amount) : '—'}</div></div>
      <div class="dg-item"><div class="l">Requester</div><div class="v">${esc(p.requesterName)}</div></div>
      <div class="dg-item"><div class="l">Supplier</div><div class="v">${esc(p.supplier || '—')}</div></div>
      <div class="dg-item"><div class="l">Received</div><div class="v">${fmtDate(p.dateReceived)}${p.gsuiteRef ? ' · ' + esc(p.gsuiteRef) : ''}</div></div>
    </div>
    ${p.description ? `<div class="callout info mb14">${icon('info', 15)}<div>${esc(p.description)}</div></div>` : ''}
    ${(p.documents || []).length ? `<div class="mb14"><b class="small">Attached documents (${p.documents.length}):</b><div class="doc-list mt8">${p.documents.map(i => { const d = docById(i); return d ? docItemHTML(d) : ''; }).join('')}</div></div>` : ''}`,
    fn: (ok, note) => {
      const dec = { decision: ok ? 'approved' : 'rejected', by: ME.id, byName: ME.name, at: nowISO(), note };
      p[stage] = dec; p.updatedAt = nowISO();
      const nextStage = stage === 'goni' ? (wf.requireJibo ? 'pending_jibo' : (wf.requireDG ? 'pending_dg' : 'approved'))
        : stage === 'jibo' ? (wf.requireDG ? 'pending_dg' : 'approved') : 'approved';
      if (!ok) {
        p.status = 'rejected';
        addEvent(p, 'REJECTED by ' + meta.who + (note ? ' — ' + note : ''), '', 'danger');
        notify(usersWithPerm('log_procurement').map(u => u.id), { title: p.code + ' rejected by ' + meta.who, body: p.title + (note ? ' — ' + note : ''), link: 'procurement' });
        sendEmail(meta.evKey, [procEmails().procurement].filter(Boolean).join(', '), 'Procurement ' + p.code + ' rejected by ' + meta.who,
          `<p>Procurement request <b>${p.code}</b> (${esc(p.title)}) was <b style="color:#c0341d">rejected</b> by ${esc(meta.who)}.</p>${note ? `<p><b>Reason:</b> ${esc(note)}</p>` : ''}`, p.code);
        save(); closeModal(); render(); toast(p.code + ' rejected.', 'warn'); return;
      }
      addEvent(p, 'Approved by ' + meta.who + (note ? ' — ' + note : ''), '', 'ok');
      if (nextStage === 'approved') {
        p.status = 'approved';
        addEvent(p, 'FULLY APPROVED — procurement cleared', 'PO may now be issued', 'ok');
        notify(usersWithPerm('log_procurement').map(u => u.id), { title: p.code + ' fully approved', body: p.title + ' — you may issue the PO.', link: 'procurement' });
        sendEmail('procurement_dg', [procEmails().procurement, procEmails().goni, procEmails().jibo].filter(Boolean).join(', '), 'Procurement ' + p.code + ' FULLY APPROVED',
          `<p>Procurement request <b>${p.code}</b> (${esc(p.title)}) has completed the full approval chain (Goni → Jibo → DG).</p>
           <p><b>Amount:</b> ${p.amount ? fmtMoney(p.amount) : '—'} · <b>Supplier:</b> ${esc(p.supplier || '—')}</p>
           <p>The Procurement Officer may now raise the Purchase Order.</p>`, p.code);
      } else {
        p.status = nextStage;
        const nm = nextStage === 'pending_jibo' ? { perm: 'approve_finance', who: 'Jibo (Finance Officer)' } : { perm: 'approve_dg', who: 'Director General' };
        notify(usersWithPerm(nm.perm).map(u => u.id), { title: p.code + ' awaiting your approval', body: p.title, link: 'approvals' });
        sendEmail(meta.evKey, procEmails()[nextStage === 'pending_jibo' ? 'jibo' : 'dg'], 'Procurement ' + p.code + ' — your approval is required',
          `<p><b>${esc(meta.who)}</b> has approved procurement <b>${p.code}</b> (${esc(p.title)}).</p>
           <p><b>Amount:</b> ${p.amount ? fmtMoney(p.amount) : '—'} · <b>Department:</b> ${esc(p.department)}${p.supplier ? ' · <b>Supplier:</b> ' + esc(p.supplier) : ''}</p>
           <p>Please log in to <b>approve or reject</b> it.</p>`, p.code);
      }
      save(); closeModal(); render(); toast('Decision recorded for ' + p.code + '.');
    }
  });
}
ACTIONS.proc_goni = (d) => { const p = procById(d.id); if (p) procDecisionModal(p, 'goni'); };
ACTIONS.proc_jibo = (d) => { const p = procById(d.id); if (p) procDecisionModal(p, 'jibo'); };

ACTIONS.proc_stage = (d) => {

FORMS.proc_stage_form = (fd, form) => {
  const p = procById(form.dataset.id); if (!p) return;

  }[step], (step === 'po_issued' ? 'PO ' + p.stage.poNumber + ' · ' : '') + fmtDate(fd.get('date')) + (fd.get('note') ? ' · ' + fd.get('note') : ''), step === 'completed' ? 'ok' : 'purple');
  notify(usersWithPerm('log_procurement').map(u => u.id), { title: p.code + ' — ' + step.replace('_', ' '), body: p.title, link: 'procurement' });
  sendEmail('procurement_stage', procEmails().procurement, 'Procurement ' + p.code + ' — ' + step.replace('_', ' '),
    `<p>Stage update on <b>${p.code}</b> (${esc(p.title)}): <b>${step.replace('_', ' ')}</b> — ${fmtDate(fd.get('date'))}.</p>`, p.code);
  save(); closeModal(); render(); toast('Stage updated.');
};

/* ---------- Detail ---------- */
function procApprCard(title, decision, icon_, who) {
  let cls = 'pending', right = '<span class="pill s-muted">Awaiting</span>', extra = '';
  if (decision && decision.decision === 'approved') { cls = 'decided-ok'; right = '<span class="pill s-ok">Approved ✔</span>'; }
  if (decision && decision.decision === 'rejected') { cls = 'decided-danger'; right = '<span class="pill s-danger">Rejected</span>'; }
  if (decision && decision.decision) extra = `<div class="meta mt8"><b>${esc(decision.byName)}</b> · ${fmtDateTime(decision.at)}${decision.note ? '<br>Note: ' + esc(decision.note) : ''}</div>`;
  return `<div class="appr-card ${cls}"><div class="ah"><div class="an">${icon(icon_, 15)} ${title}</div><div class="ar">${right}</div></div>
    <div class="meta">${who}</div>${extra}</div>`;
}
function procDetail(id) {
  const p = procById(id); if (!p) return;
  const wf = S.settings.workflow.procurement;
  const docs = (p.documents || []).map(i => docById(i)).filter(Boolean);
  const buttons = [];
  if (p.status === 'pending_goni' && hasPerm('approve_goni')) buttons.push(`<button class="btn primary" data-act="proc_goni" data-id="${p.id}">${icon('check2', 14)} Goni — Approve / Reject</button>`);
  if (p.status === 'pending_jibo' && hasPerm('approve_finance')) buttons.push(`<button class="btn primary" data-act="proc_jibo" data-id="${p.id}">${icon('check2', 14)} Jibo (Finance) — Approve / Reject</button>`);
  if (p.status === 'pending_dg' && hasPerm('approve_dg')) buttons.push(`<button class="btn primary" data-act="proc_dg" data-id="${p.id}">${icon('shield', 14)} DG — Final Approval</button>`);
  if (hasPerm('log_procurement') && p.status === 'approved') buttons.push(`<button class="btn primary" data-act="proc_stage" data-id="${p.id}" data-step="po_issued">${icon('file', 14)} Issue PO</button>`);
  if (hasPerm('log_procurement') && p.status === 'po_issued') buttons.push(`<button class="btn primary" data-act="proc_stage" data-id="${p.id}" data-step="delivered">${icon('cart', 14)} Mark Delivered</button>`);
  if (hasPerm('log_procurement') && p.status === 'delivered') buttons.push(`<button class="btn ok" data-act="proc_stage" data-id="${p.id}" data-step="completed">${icon('check2', 14)} Mark Completed</button>`);
  if (hasPerm('log_procurement') && !['rejected', 'completed'].includes(p.status)) buttons.push(`<button class="btn" data-act="proc_upload" data-id="${p.id}">${icon('upload', 14)} Upload Document</button>`);
  openModal(`${modalHead(`${esc(p.code)} ${pill(p.status, PROC_STATUS)}`, esc(p.title) + ' · logged ' + fmtDate(p.createdAt))}
    <div class="m-b">

function storageBytes() {
  let used = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); used += (localStorage.getItem(k) || '').length + k.length; } } catch (e) {}
  const quota = 5 * 1024 * 1024; // ~5MB typical localStorage limit (chars ≈ 2 bytes UTF-16, keep conservative)
  return { used: used * 2, quota, pct: Math.round(used * 2 / quota * 100) };
}

const CHART_COLORS = ['#0e6b4f', '#c9a227', '#1f5fb0', '#6d3bb8', '#b45d0a', '#178a54', '#c0341d'];
function hbarChart(items) {
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div class="hbar">${items.map(i => `
    <div class="hb"><div class="hl"><span>${esc(i.label)}</span><span class="hv">${i.fmt || fmtMoney(i.value)}</span></div>
    <div class="track"><div style="width:${Math.max(3, Math.round(i.value / max * 100))}%"></div></div></div>`).join('')}</div>`;
}
function donut(items) {
  const total = items.reduce((s, i) => s + i.value, 0) || 1;
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = items.filter(i => i.value > 0).map(i => {
    const frac = i.value / total;
    const seg = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${i.color}" stroke-width="21" stroke-dasharray="${(frac * C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(${(off * 360 - 90).toFixed(2)} 70 70)"></circle>`;
    off += frac; return seg;
  }).join('');
  return `<div class="flex" style="gap:20px;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:150px;height:150px;flex-shrink:0">${segs}
      <text x="70" y="66" text-anchor="middle" font-size="20" font-weight="800" fill="#13211c">${items.reduce((s, i) => s + i.value, 0)}</text>
      <text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#5f6f69">TOTAL</text></svg>
    <div class="chart-legend" style="flex-direction:column;gap:8px">${items.map(i => `
      <div class="li"><span class="sw" style="background:${i.color}"></span>${esc(i.label)} <b style="margin-left:auto;color:var(--ink)">${i.value}</b></div>`).join('')}</div></div>`;
}
function lineChart(labels, series) {
  const W = 620, H = 240, PL = 56, PR = 16, PT = 16, PB = 36;
  const n = labels.length;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const niceMax = Math.ceil(max / 500000) * 500000 || 500000;
  const x = i => PL + (W - PL - PR) * (n < 2 ? 0.5 : i / (n - 1));
  const y = v => H - PB - (H - PT - PB) * (v / niceMax);
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const v = niceMax * g / 4, yy = y(v);
    grid += `<line x1="${PL}" y1="${yy}" x2="${W - PR}" y2="${yy}" stroke="#e8efec" stroke-width="1"></line>
      <text x="${PL - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#8fa19a">${v >= 1000000 ? (v / 1000000) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : v}</text>`;
  }
  const xlabels = labels.map((l, i) => `<text x="${x(i)}" y="${H - 14}" text-anchor="middle" font-size="10.5" fill="#5f6f69">${esc(l)}</text>`).join('');
  const lines = series.map(s => `
    <polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
      points="${s.values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"></polyline>
    ${s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${s.color}" stroke-width="2.5"></circle>`).join('')}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg">${grid}${xlabels}${lines}</svg>
    <div class="chart-legend">${series.map(s => `<div class="li"><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</div>`).join('')}</div>`;
}

function setPath(obj, path, val) {

  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}

    setPath(S.settings, el.dataset.setting, val);
    save(); toast('Setting saved.');
  }
  if (el && el.dataset && el.dataset.dept !== undefined && el.value.trim()) {
    S.settings.departments[Number(el.dataset.dept)] = el.value.trim(); save(); toast('Department renamed.');
  }
});

    'Community & Mosque Operations': S.users.find(u => u.email === 'mosque@icice.org'),
    'Education & Training': S.users.find(u => u.email === 'education@icice.org'),
    'Al-Noor Academy': S.users.find(u => u.email === 'academy@icice.org'),
    "DG's Office": S.users.find(u => u.email === 'dg@icice.org'),
    'ICT': S.users.find(u => u.email === 'ict@icice.org')
  };
  const mk = (dept, amount, purpose, status, spend) => {
    const head = heads[dept] || S.users[6];
    const imp = {
      id: uid(), code: nextImprestCode(), department: dept, requesterId: head.id, requesterName: head.name,
      amount, purpose, urgency: 'normal', status, parentImprestId: null,
      finance: { decision: ['pending_finance'].includes(status) ? null : { decision: 'approved', byName: 'Malam Jibo', at: daysAgo(6), note: '' } },
      dg: { decision: ['pending_finance', 'pending_dg'].includes(status) ? null : { decision: 'approved', byName: 'Director General', at: daysAgo(5), note: '' } },
      disbursement: ['disbursed', 'retirement_pending', 'retirement_dg', 'retired'].includes(status) ? { byName: 'Malam Jibo', at: daysAgo(5), method: 'Cash', date: daysAgo(5).slice(0, 10), voucher: 'PV-2026-0' + Math.floor(Math.random() * 90 + 10) } : null,
      retirement: { expenditures: [], submittedAt: null, finance: { decision: null }, dg: { decision: null } },
      timeline: [], createdAt: daysAgo(7), updatedAt: nowISO()
    };
    addEvent(imp, 'Imprest request created', fmtMoney(amount) + ' — ' + dept);
    if (status !== 'draft') addEvent(imp, 'Submitted for approval', '', 'gold');
    if (imp.finance.decision) addEvent(imp, 'Approved by Finance Office', '', 'ok');
    if (imp.dg.decision) addEvent(imp, 'Approved by Director General', '', 'ok');
    if (imp.disbursement) addEvent(imp, 'Imprest disbursed', imp.disbursement.method + ' · Voucher ' + imp.disbursement.voucher, 'purple');
    if (spend) {
      const cats = EXP_CATEGORIES.slice();
      let left = spend;
      const lines = [
        { c: cats[1], d: 'Fuel for mosque generator & generator servicing', a: Math.round(spend * .4) },
        { c: cats[0], d: 'Printing of programmes & stationery', a: Math.round(spend * .25) },
        { c: cats[4], d: 'Refreshment for volunteers', a: Math.round(spend * .2) },
        { c: cats[8], d: 'Miscellaneous logistics', a: Math.round(spend * .15) }
      ];
      lines.forEach(l => {
        const doc = mkTextDoc('receipt-' + l.d.split(' ')[0].toLowerCase() + '.txt', 'RECEIPT / EVIDENCE\n' + imp.code + '\n' + l.d + '\nAmount: NGN ' + l.a + '\nDate: ' + fmtDate(daysAgo(3)), { module: 'Imprest evidence', refCode: imp.code, department: dept, up: head.name });
        imp.retirement.expenditures.push({ id: uid(), date: daysAgo(3).slice(0, 10), category: l.c, description: l.d, amount: l.a, docIds: [doc.id] });
        left -= l.a;
      });
      addEvent(imp, 'Spending recorded: 4 line(s)', fmtMoney(spend) + ' with evidence');
      if (['retirement_pending', 'retirement_dg', 'retired'].includes(status)) {
        imp.retirement.submittedAt = daysAgo(2);
        addEvent(imp, 'Retirement submitted', '', 'gold');
        imp.retirement.finance = { decision: 'approved', byName: 'Malam Jibo', at: daysAgo(1) };
        if (status !== 'retirement_pending') addEvent(imp, 'Retirement approved by Finance Office', '', 'ok');
        if (status === 'retired') { imp.retirement.dg = { decision: 'signed', byName: 'Director General', at: daysAgo(1) }; addEvent(imp, 'RETIREMENT COMPLETED', '', 'ok'); }
      }
    }
    imp.timeline.forEach(e => { e.by = e.by === 'System' ? head.name : e.by; });
    S.imprests.unshift(imp);
    return imp;
  };
  const daysAgo = (n) => new Date(Date.now() - n * 86400000).toISOString();
  mk(depts[0], 350000, 'Welfare support and palliatives for families in the community outreach programme', 'retired', 348000);
  mk(depts[1], 500000, 'Urgent repairs of water pumps and electrical fittings at the Al-Noor mosque complex', 'retirement_pending', 472000);
  mk(depts[2], 280000, 'Friday Jumu\'ah logistics — mats, cleaning and sound system maintenance', 'disbursed', 210000);
  mk(depts[3], 200000, 'Islamic studies teachers training materials and workshop refreshment', 'pending_finance', 0);
  mk(depts[4], 450000, 'Al-Noor Academy term learning materials, chalkboards and sports equipment', 'pending_dg', 0);
  mk(depts[6], 320000, 'Network equipment and cabling for the new ICT training lab', 'retirement_dg', 300500);
  mk(depts[5], 150000, 'Hosting of visiting scholars — transport and hospitality', 'rejected', 0).dg = { decision: 'rejected', byName: 'Director General', at: daysAgo(2), note: 'Insufficient justification — please resubmit with a detailed breakdown.' };

  const mkProc = (title, dept, amount, supplier, status) => {
    const p = {
      id: uid(), code: nextProcCode(), title, description: 'Request received via the procurement email and raised on G-Suite. Quotation attached.',
      department: dept, requesterName: (heads[dept] || {}).name || 'Department Head', sourceEmail: 'procurement@icice.org',
      gsuiteRef: 'GS-2026-00' + Math.floor(Math.random() * 90 + 10),
      amount, supplier, priority: 'Normal', dateReceived: daysAgo(6).slice(0, 10),
      documents: [], goni: { decision: null }, jibo: { decision: null }, dg: { decision: null },
      stage: { poNumber: '', poAt: null, deliveredAt: null, completedAt: null },
      status, timeline: [], createdAt: daysAgo(6), updatedAt: nowISO()
    };
    const doc = mkTextDoc('quotation-' + p.code + '.txt', 'QUOTATION\n' + title + '\nSupplier: ' + supplier + '\nAmount: NGN ' + amount + '\nValid 30 days.', { module: 'Procurement', refCode: p.code, department: dept, up: 'Procurement Officer' });
    p.documents = [doc.id];
    addEvent(p, 'Request logged from procurement email (G-Suite ref ' + p.gsuiteRef + ')', dept, 'gold');
    if (status !== 'pending_goni') { p.goni = { decision: 'approved', byName: 'Malam Goni', at: daysAgo(5) }; addEvent(p, 'Approved by Goni', '', 'ok'); }
    if (['pending_dg', 'approved', 'po_issued', 'delivered', 'completed'].includes(status)) { p.jibo = { decision: 'approved', byName: 'Malam Jibo', at: daysAgo(4) }; addEvent(p, 'Approved by Jibo (Finance)', '', 'ok'); }
    if (['approved', 'po_issued', 'delivered', 'completed'].includes(status)) { p.dg = { decision: 'approved', byName: 'Director General', at: daysAgo(3) }; addEvent(p, 'Approved by Director General', '', 'ok'); addEvent(p, 'FULLY APPROVED — procurement cleared', '', 'ok'); }
    if (['po_issued', 'delivered', 'completed'].includes(status)) { p.stage.poNumber = 'PO-2026-0' + Math.floor(Math.random() * 90 + 10); p.stage.poAt = daysAgo(2).slice(0, 10); addEvent(p, 'Purchase Order issued', p.stage.poNumber, 'purple'); }
    if (['delivered', 'completed'].includes(status)) { p.stage.deliveredAt = daysAgo(1).slice(0, 10); addEvent(p, 'Goods/services delivered', '', 'purple'); }
    if (status === 'completed') { p.stage.completedAt = daysAgo(1).slice(0, 10); addEvent(p, 'Procurement COMPLETED', '', 'ok'); }
    if (status === 'rejected') { p.status = 'rejected'; p.goni = { decision: 'rejected', byName: 'Malam Goni', at: daysAgo(4), note: 'Better quotation needed — resubmit with 3 quotes.' }; addEvent(p, 'REJECTED by Goni — better quotation needed', '', 'danger'); }
    S.procurements.unshift(p);
  };
  mkProc('Supply of 40 HP LaserJet printers for academy offices', depts[4], 2400000, 'TechHub Nigeria Ltd', 'pending_goni');
  mkProc('Annual pest control & fumigation of mosque complex', depts[2], 850000, 'CleanGuard Services', 'pending_jibo');
  mkProc('Supply of 500 plastic chairs for the multipurpose hall', depts[1], 1750000, 'Sittex Furniture Ltd', 'pending_dg');
  mkProc('Installation of 6 split-unit ACs in the ICT lab', depts[6], 2100000, 'CoolBreeze Aircon', 'po_issued');
  mkProc('Supply of Ramadan food packs (500 units)', depts[0], 5000000, 'Blessed Farms & Foods', 'completed');
  mkProc('Refurbishment of academy school bus', depts[4], 1300000, 'AutoFix Motors', 'rejected');

  notify(usersWithPerm('approve_finance').map(u => u.id), { title: 'Demo data loaded', body: 'Sample records are ready for review in Approvals.', link: 'approvals' });
  notify(usersWithPerm('approve_goni').map(u => u.id), { title: 'Demo data loaded', body: 'A procurement request is waiting for Goni.', link: 'approvals' });
  save();
}

/* ---------- Global search wiring ---------- */
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'globalSearch') {
    ui.search = e.target.value;
    const drop = $('#searchDrop'); if (drop) drop.innerHTML = searchResultsHTML(ui.search);
  }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.searchbox')) { const d = $('#searchDrop'); if (d) d.innerHTML = ''; }
  if (!e.target.closest('#userPop') && !e.target.closest('.userchip')) { const p = $('#userPop'); if (p) p.classList.add('hidden'); }
  if (!e.target.closest('#notifPop') && !e.target.closest('[data-act="bell_toggle"]')) { const p = $('#notifPop'); if (p) p.classList.add('hidden'); }
});

/* ---------- Boot ---------- */
function boot() {
  S = null;
  try { S = JSON.parse(storage.get(STORE_KEY)); } catch (e) {}
  if (!S || !S.users) seed();
  try {
    const l = document.createElement('link'); l.rel = 'icon'; l.href = window.LOGO; document.head.appendChild(l);
    const t = document.createElement('title'); t.textContent = S.settings.org.name + ' — ' + S.settings.org.sub; document.head.appendChild(t);
  } catch (e) {}
  restoreSession();
  render();
  setInterval(updateClock, 30000);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
